[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqwave"
dynamic = ["version"]
authors = [
    {name = "niuniuaba", email = "liuyongjin@petalmail.com"}
]
description = "A Wave Viewer for SPICE raw data using spicelib and PyQtGraph"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyQt6>=6.5.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.21.0",
    "scipy>=1.0",
    "spicelib>=0.1.0",
    "eyediagram>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
headless = [
    "matplotlib>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/niuniuaba/pqwave"
Repository = "https://github.com/niuniuaba/pqwave.git"
Issues = "https://github.com/niuniuaba/pqwave/issues"

[tool.setuptools.dynamic]
# Single source of truth: pqwave/_version.py
version = {attr = "pqwave._version.__version__"}

[project.scripts]
pqwave = "pqwave.main:main"

[tool.mypy]
# `make lint` used to invoke `mypy pqwave.py pqwave/`, which aborts instantly with
# 'Duplicate module named "pqwave"' -- the root pqwave.py wrapper and the package
# both claim that module name -- so nothing was ever type-checked. Check the
# package only, and carry the flags here so a bare `mypy pqwave/` behaves the same.
files = ["pqwave"]
exclude = ["^venv/", "^build/", "^dist/", "^docs/"]
ignore_missing_imports = true
# Neither pyqtgraph nor spicelib ship py.typed markers; without this every use of
# them is reported as an import-untyped error instead of being treated as Any.
follow_imports = "silent"
disable_error_code = ["annotation-unchecked"]

[tool.pytest.ini_options]
testpaths = ["pqwave/tests"]
# QT_QPA_PLATFORM=offscreen is set by pqwave/tests/conftest.py before anything
# imports Qt, so a bare `pytest` works with no display (pytest-env is not a dep).
filterwarnings = [
    # A test that ends in `return False` does NOT fail under pytest; it only warns.
    # Several legacy modules in pqwave/tests did exactly that, so their checks could
    # never fail. Treat the warning as an error to keep that from coming back.
    "error::pytest.PytestReturnNotNoneWarning",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pqwave*"]
exclude = ["tests*", "archieves*"]

[tool.setuptools.package-data]
"pqwave.bridge.xschem" = ["*.tcl"]
"pqwave.bridge.lepton" = ["*.scm"]
