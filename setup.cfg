[flake8]
# Working standard for this tree, chosen against measured line lengths:
#   >79  1199 lines   >88   279   >100    93   >120    21
# The previous implicit 79-column limit made `make lint` report ~1500 E501s, so the
# signal was worthless. 100 keeps the rule meaningful without demanding a repo-wide
# rewrap. `black` remains the formatter of record (`make format`).
max-line-length = 100
# E203/W503 disagree with black's slicing and line-break placement.
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    venv,
    .venv,
    *.egg-info,
    .mypy_cache,
    .pytest_cache,
    docs,
    openspec
# Tests legitimately set sys.path before importing, and re-export helpers.
per-file-ignores =
    __init__.py: F401
    pqwave/tests/*: E402, F401, F811, E501
